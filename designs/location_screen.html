<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiwi - Detect Location</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#0284c7',
              600: '#0369a1',
              emerald: '#059669',
              teal: '#0d9488'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
<style>
    @keyframes pulseRing {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.35;
      }
      100% {
        transform: scale(0.85);
        opacity: 0.8;
      }
    }
    @keyframes radarSweep {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    .pulse-ring-outer {
      animation: pulseRing 4s ease-in-out infinite;
    }
    .pulse-ring-inner {
      animation: pulseRing 4s ease-in-out 1.2s infinite;
    }
  </style>
</head>
<body class="bg-[#F0F4F8] text-slate-800 font-sans min-h-screen flex flex-col justify-between items-center antialiased selection:bg-sky-100 select-none overflow-x-hidden p-4">
<!-- Mobile Wrapper Container (390px native mobile fidelity) -->
<div class="w-full max-w-[390px] flex-1 flex flex-col justify-between relative py-2">
<!-- Mobile Top Header -->
<header class="w-full flex items-center justify-between pt-1 pb-3 px-1">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-xl bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-teal-600">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
</div>
<span class="font-display font-bold text-lg tracking-tight text-slate-900">Kiwi</span>
</div>
<!-- Status badge indicator -->
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/90 border border-slate-200/70 shadow-[0_1px_3px_rgba(0,0,0,0.03)]">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
</span>
<span class="text-[11px] font-mono tracking-wider font-semibold uppercase text-slate-600">GPS LOCKED</span>
</div>
</header>
<!-- Mobile Radar & Location Details -->
<main class="w-full flex-1 flex flex-col items-center justify-center py-4 text-center">
<!-- Scaled Mobile Radar Graphic Component -->
<div class="relative w-60 h-60 flex items-center justify-center mb-6">
<!-- Soft background radial gradient glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-sky-200/40 via-teal-100/30 to-blue-200/30 blur-2xl pointer-events-none"></div>
<!-- Outer concentric faint ring -->
<div class="absolute w-full h-full rounded-full border border-sky-200/60 pulse-ring-outer"></div>
<!-- Mid concentric dashed ring with compass indicators -->
<div class="absolute w-44 h-44 rounded-full border border-dashed border-sky-300/70 pulse-ring-inner flex items-center justify-center">
<span class="absolute top-1 text-[9px] font-mono text-sky-400 font-bold tracking-widest">N</span>
<span class="absolute bottom-1 text-[9px] font-mono text-sky-400 font-bold tracking-widest">S</span>
<span class="absolute left-1.5 text-[9px] font-mono text-sky-400 font-bold tracking-widest">W</span>
<span class="absolute right-1.5 text-[9px] font-mono text-sky-400 font-bold tracking-widest">E</span>
</div>
<!-- Inner concentric soft glow border -->
<div class="absolute w-32 h-32 rounded-full border border-sky-200/80 bg-white/40 backdrop-blur-sm shadow-[inset_0_0_15px_rgba(186,224,253,0.3)]"></div>
<!-- Center Dial / Pin Card -->
<div class="relative z-10 w-20 h-20 rounded-full bg-white shadow-[0_12px_28px_-6px_rgba(14,116,144,0.18),0_4px_10px_rgba(0,0,0,0.04)] border border-slate-100 flex flex-col items-center justify-center transition-transform duration-300 hover:scale-105 active:scale-95 cursor-pointer">
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-500 to-teal-500 text-white flex items-center justify-center shadow-md shadow-sky-500/25">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
<circle cx="12" cy="10" r="3"></circle>
</svg>
</div>
<!-- Accuracy badge -->
<div class="absolute -bottom-1 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 shadow-sm flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
<span class="text-[9px] font-mono font-bold text-emerald-700">±2m</span>
</div>
</div>
<!-- Satellite Orbiting Point -->
<div class="absolute w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8] border-2 border-white top-8 right-10"></div>
</div>
<!-- Current Location Text Block -->
<div class="space-y-1.5 px-2 max-w-[340px]">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-sky-100/70 text-sky-800 text-xs font-semibold tracking-wide">
<svg class="w-3.5 h-3.5 text-sky-600" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Current Location</span>
</div>
<h2 class="text-xl font-bold font-display text-slate-900 tracking-tight leading-tight">
          VIT University, Vellore
        </h2>
<p class="text-xs text-slate-500 font-medium px-2">
          Auto-detected via Wi-Fi Beacon &amp; Cell Triangulation
        </p>
</div>
<!-- Secondary Input Tile: Enter Location Manually -->
<div class="w-full mt-5 px-1">
<button class="w-full bg-white hover:bg-slate-50/80 active:scale-[0.99] transition-all duration-200 border border-slate-200/90 rounded-2xl p-3 px-4 shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex items-center justify-between group cursor-pointer text-left" type="button">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center group-hover:bg-sky-50 group-hover:text-sky-600 transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
</svg>
</div>
<div>
<span class="block text-sm font-semibold text-slate-800 group-hover:text-slate-900 transition-colors">
                Enter Location Manually
              </span>
<span class="block text-[11px] text-slate-400 font-normal">
                If auto-detection is inaccurate or disabled
              </span>
</div>
</div>
<div class="text-slate-400 group-hover:text-slate-600 group-hover:translate-x-0.5 transition-all">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</div>
</main>
<!-- Sticky Bottom Mobile Actions Footer -->
<footer class="w-full pt-3 pb-2 px-1 space-y-3 sticky bottom-0 bg-[#F0F4F8]/90 backdrop-blur-sm">
<button class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-teal-600 via-sky-600 to-sky-500 hover:from-teal-700 hover:to-sky-600 active:scale-[0.985] text-white font-semibold text-base shadow-[0_10px_22px_-6px_rgba(2,132,199,0.45)] transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer" type="button">
<span>Confirm Location &amp; Continue</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24">
<path d="M5 12h14"></path>
<path d="m12 5 7 7-7 7"></path>
</svg>
</button>
<!-- Trust Assurance Footnote -->
<div class="flex items-center justify-center gap-1.5 text-[11px] font-mono uppercase tracking-wider text-slate-400">
<svg class="w-3.5 h-3.5 text-teal-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
<span>Kiwi Hardware Trust Anchor • 802.11ax</span>
</div>
</footer>
</div>
</body>
</html>
