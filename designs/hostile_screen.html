<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kiwi - Connection Not Verified</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FDE8E8;
      color: #151719;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Mobile Frame Container -->
  <div class="w-full max-w-[390px] h-[844px] bg-[#FDE8E8] rounded-[48px] shadow-2xl flex flex-col justify-between p-6 relative overflow-hidden border border-red-100">
    
    <!-- Top Header -->
    <header class="flex items-center space-x-3 pt-2">
      <div class="w-11 h-11 bg-gray-200/80 rounded-xl flex items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-gray-800 text-2xl">psychology_alt</span>
      </div>
      <span class="text-2xl font-bold tracking-tight text-gray-900">Kiwi</span>
    </header>

    <!-- Center Graphic: Concentric Circles with Off-Wi-Fi Icon -->
    <main class="flex-1 flex flex-col items-center justify-center my-auto">
      <div class="relative w-64 h-64 flex items-center justify-center">
        <!-- Outer Circle -->
        <div class="absolute inset-0 rounded-full bg-[#FCE1E1]/60 flex items-center justify-center">
          <!-- Middle Circle -->
          <div class="w-48 h-48 rounded-full bg-[#FCD5D5] flex items-center justify-center">
            <!-- Inner Circle -->
            <div class="w-32 h-32 rounded-full bg-[#FBBFBF] flex items-center justify-center shadow-inner">
              <span class="material-symbols-outlined text-gray-900 text-5xl">portable_wifi_off</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Headline -->
      <h1 class="text-[28px] font-extrabold text-gray-900 tracking-tight mt-10 text-center">
        Connection Not Verified
      </h1>
    </main>

    <!-- Bottom Actions -->
    <footer class="flex flex-col space-y-4 pb-4">
      <!-- Main Orange Button -->
      <button type="button" class="w-full h-14 bg-[#FF7A38] text-white font-bold text-lg rounded-full shadow-md hover:bg-[#F26A27] transition-colors flex items-center justify-center">
        Blocked for safety
      </button>

      <!-- Bypass Link -->
      <button type="button" class="w-full flex items-center justify-center space-x-1.5 text-gray-700 hover:text-gray-900 text-base italic font-medium pt-1">
        <span>Bypass anyway</span>
        <span class="material-symbols-outlined text-xl not-italic">arrow_forward</span>
      </button>
    </footer>

  </div>
</body>
</html>
